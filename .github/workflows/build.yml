name: Build HELL CREATOR OS (Android e Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Android e Compilar APK
        run: |
          flutter create --platforms=android --project-name hell_creator_os .
          sed -i 's/android:label="hell_creator_os"/android:label="HELL CREATOR OS"/g' android/app/src/main/AndroidManifest.xml
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          printf '\nsubprojects {\n    plugins.withId("com.android.library") {\n        extensions.configure<com.android.build.gradle.LibraryExtension>("android") {\n            compileSdk = 36\n        }\n    }\n}\n' >> android/build.gradle.kts || true
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 -c "from PIL import Image, ImageDraw; img = Image.open('icon.png').convert('RGBA'); px = [(r, g, b, 0) if (r < 20 and g < 20 and b < 30) else (r, g, b, a) for r, g, b, a in img.getdata()]; img.putdata(px); bg = Image.new('RGBA', (1024, 1024), (5, 8, 17, 255)); glow = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0)); draw = ImageDraw.Draw(glow); [draw.ellipse([512-r, 512-r, 512+r, 512+r], fill=(0, 229, 255, int(115*(1-r/430)))) for r in range(430, 0, -8)]; bg = Image.alpha_composite(bg, glow); fg = img.resize((660, 660)); bg.paste(fg, (182, 182), fg); bg.save('icon_tablet.png')"
          sed -i 's/adaptive_icon_background: "#000000"/adaptive_icon_background: "#050811"/g' pubspec.yaml
          sed -i 's/adaptive_icon_foreground: "icon.png"/adaptive_icon_foreground: "icon_tablet.png"/g' pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - name: Guardar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-CREATOR-OS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Windows e Compilar EXE
        run: |
          flutter create --platforms=windows --project-name hell_creator_os .
          flutter pub get
          dart run flutter_launcher_icons
          $env:CXXFLAGS="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release
      - name: Guardar App Windows para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-CREATOR-OS-Windows-PC
          path: build/windows/x64/runner/Release/
