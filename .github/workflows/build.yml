name: Build HELL CREATOR OS (Android e Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Android e Compilar APK
        run: |
          flutter create --platforms=android --project-name hell_creator_os .
          cp google-services.json android/app/google-services.json || true
          sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services") version "4.3.15"/g' android/app/build.gradle.kts || true
          sed -i 's/android:label="hell_creator_os"/android:label="HELL CREATOR OS"/g' android/app/src/main/AndroidManifest.xml
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
          echo 'subprojects { val applySdk: (Project) -> Unit = { p -> p.extensions.findByName("android")?.let { (it as com.android.build.gradle.BaseExtension).compileSdkVersion(36) } }; if (state.executed) applySdk(this) else afterEvaluate { applySdk(this) } }' >> android/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/g' android/app/build.gradle.kts || true
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 -c "from PIL import Image, ImageDraw, ImageFilter; base = Image.new('RGBA', (1024, 1024), (5, 11, 30, 255)); glow = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0)); d = ImageDraw.Draw(glow); d.ellipse([140, 140, 884, 884], fill=(30, 120, 255, 150)); d.ellipse([230, 230, 794, 794], fill=(56, 189, 248, 190)); glow = glow.filter(ImageFilter.GaussianBlur(85)); base = Image.alpha_composite(base, glow); ring = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0)); dr = ImageDraw.Draw(ring); dr.ellipse([95, 95, 929, 929], outline=(56, 189, 248, 220), width=18); ring = ring.filter(ImageFilter.GaussianBlur(10)); base = Image.alpha_composite(base, ring); logo = Image.open('icon.png').convert('RGBA').resize((880, 880), Image.Resampling.LANCZOS); base.paste(logo, (72, 72), logo); base.save('icon_neon.png')"
          sed -i 's/adaptive_icon_background: .*/adaptive_icon_background: "#050B1E"/g' pubspec.yaml
          sed -i 's/adaptive_icon_foreground: "icon.png"/adaptive_icon_foreground: "icon_neon.png"/g' pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons
                   if [ -f hell_release.jks ]; then
            cp hell_release.jks android/app/hell_release.jks
          else
            keytool -genkey -v -keystore hell_release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias hell_key -storepass hell12026os -keypass hell12026os -dname "CN=HELL CREATOR OS, OU=Studio, O=HELL, L=Lisbon, S=Lisbon, C=PT"
            cp hell_release.jks android/app/hell_release.jks
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add hell_release.jks
            git commit -m "Fixar chave permanente hell_release.jks" || true
            git push || true
          fi
          keytool -list -v -keystore android/app/hell_release.jks -alias hell_key -storepass hell12026os -keypass hell12026os | grep "SHA1:"
          printf "storePassword=hell2026os\nkeyPassword=hell2026os\nkeyAlias=hell_key\nstoreFile=hell_release.jks\n" > android/key.properties
          flutter build apk --release
      - name: Guardar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-CREATOR-OS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Windows e Compilar EXE
        run: |
          flutter create --platforms=windows --project-name hell_creator_os .
          flutter pub get
          dart run flutter_launcher_icons
          $env:CXXFLAGS="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release
      - name: Guardar App Windows para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-CREATOR-OS-Windows-PC
          path: build/windows/x64/runner/Release/
