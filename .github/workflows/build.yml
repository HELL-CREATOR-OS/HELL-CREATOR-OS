name: Build HELL CREATOR OS (Android APK + Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Android e Compilar APK
        run: |
          flutter create --platforms=android --project-name hell_creator_os .
          cp google-services.json android/app/google-services.json
                    python3 -c 'import pathlib; p1=pathlib.Path("android/build.gradle.kts"); p1.write_text("buildscript { repositories { google(); mavenCentral() }; dependencies { classpath(\"com.google.gms:google-services:4.4.2\") } }\n" + p1.read_text()); p2=pathlib.Path("android/app/build.gradle.kts"); p2.write_text(p2.read_text() + "\napply(plugin = \"com.google.gms.google-services\")\n")'

          sed -i 's/android:label="hell_creator_os"/android:label="HELL CREATOR"/g' android/app/src/main/AndroidManifest.xml

          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
          echo 'subprojects { val applySdk: (Project) -> Unit = { p -> p.extensions.findByName("android")?.let { (it as com.android.build.gradle.BaseExtension).compileSdkVersion(36) } }; if (state.executed) applySdk(this) else afterEvaluate(applySdk) }' >> android/build.gradle.kts
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/g' android/app/build.gradle.kts || true
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 -c "from PIL import Image, ImageDraw, ImageFilter; base = Image.new('RGBA', (1024, 1024), (5, 11, 30, 255)); glow = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0)); d = ImageDraw.Draw(glow); d.ellipse([140, 140, 884, 884], fill=(0, 195, 255, 165)); glow = glow.filter(ImageFilter.GaussianBlur(85)); base.alpha_composite(glow); icon = Image.open('icon.png').convert('RGBA').resize((780, 780)); base.alpha_composite(icon, (122, 122)); base.save('icon_neon.png')"
          sed -i 's/adaptive_icon_background: .*/adaptive_icon_background: "#050B1E"/g' pubspec.yaml
          sed -i 's/adaptive_icon_foreground: "icon.png"/adaptive_icon_foreground: "icon_neon.png"/g' pubspec.yaml
                   python3 -c "import os, wave, struct, math; os.makedirs('assets/sounds', exist_ok=True); sr=44100; mk=lambda n,d,f: (lambda w: (w.setnchannels(2), w.setsampwidth(2), w.setframerate(sr), w.writeframes(b''.join(struct.pack('<hh', int(max(-32767,min(32767,32767*f(i/sr,d)))), int(max(-32767,min(32767,32767*f(i/sr,d))))) for i in range(int(sr*d)))), w.close()))(wave.open('assets/sounds/'+n,'w')); mk('hell_startup.wav',1.6,lambda t,d:0.45*min(1,t/0.08)*math.exp(-2.0*(t/d))*(0.55*math.sin(2*math.pi*(110+330*(t/d))*t)+0.3*math.sin(2*math.pi*(440+440*(t/d))*t)+0.15*math.sin(2*math.pi*1320*t))); mk('tap_cyber.wav',0.06,lambda t,d:0.35*math.exp(-45*t)*math.sin(2*math.pi*920*t)); mk('tap_glass.wav',0.05,lambda t,d:0.35*math.exp(-55*t)*math.sin(2*math.pi*1480*t)); mk('tap_pulse.wav',0.07,lambda t,d:0.38*math.exp(-38*t)*math.sin(2*math.pi*(320+400*t)*t)); mk('tap_zerog.wav',0.08,lambda t,d:0.32*math.exp(-30*t)*(0.6*math.sin(2*math.pi*660*t)+0.4*math.sin(2*math.pi*990*t))); mk('music_cyber.wav',8.0,lambda t,d:0.25*(0.5*math.sin(2*math.pi*(110 if int(t*2)%4<2 else 146.83)*t)+0.3*math.sin(2*math.pi*220*t)*(0.5+0.5*math.sin(2*math.pi*2*t)))); mk('music_lofi.wav',8.0,lambda t,d:0.24*(0.5*math.sin(2*math.pi*(130.81 if int(t)%4<2 else 164.81)*t)+0.25*math.sin(2*math.pi*261.63*t)))"

          flutter pub get
          dart run flutter_launcher_icons
          cp hell_release.jks android/app/hell_release.jks
          printf "storePassword=hell12026os\nkeyPassword=hell12026os\nkeyAlias=hell_key\nstoreFile=hell_release.jks\n" > android/key.properties
                   python3 -c 'import pathlib; p=pathlib.Path("android/app/build.gradle.kts"); p.write_text(p.read_text().replace("signingConfigs.getByName(\"debug\")", "signingConfigs.create(\"release\") { storeFile = file(\"hell_release.jks\"); storePassword = \"hell12026os\"; keyAlias = \"hell_key\"; keyPassword = \"hell12026os\" }"))'
                       flutter build apk --release
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -i "sha" || true


      - name: Guardar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-CREATOR-OS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Windows e Compilar EXE
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name hell_creator_os .
                    pip install pillow
          python -c "from PIL import Image; img = Image.open('icon.png'); img.save('windows/runner/resources/app_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          (Get-Content "windows/runner/main.cpp" -Raw) -replace 'hell_creator_os', 'HELL CREATOR' | Set-Content "windows/runner/main.cpp"
          $cmake = Get-Content "windows/CMakeLists.txt" -Raw
          $cmake = $cmake -replace "project\(", "add_definitions(/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`nproject("
          Set-Content "windows/CMakeLists.txt" $cmake
                    python -c "import os, wave, struct, math; os.makedirs('assets/sounds', exist_ok=True); sr=44100; dur=1.5; w=wave.open('assets/sounds/hell_startup.wav','w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); frames=b''.join(struct.pack('<h', int(32767 * 0.42 * min(1.0, i/(sr*0.08)) * math.exp(-2.2*(i/(sr*dur))) * (0.55*math.sin(2*math.pi*(110 + 330*(i/(sr*dur)))*(i/sr)) + 0.30*math.sin(2*math.pi*(440 + 440*(i/(sr*dur)))*(i/sr)) + 0.15*math.sin(2*math.pi*1320*(i/sr))))) for i in range(int(sr*dur))); w.writeframes(frames); w.close()"
             flutter build windows --release
    


      - name: Guardar Windows EXE para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-CREATOR-OS-Windows-EXE
          path: build/windows/x64/runner/Release/
